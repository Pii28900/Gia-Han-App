name: Build Windows App
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1' 
    steps:
      - uses: actions/checkout@v4
      - name: Validate scanner script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/scan_windows.ps1).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'Scanner script syntax is invalid' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0 playwright==1.56.0
      - name: Test logic and Windows GUI
        shell: python
        run: |
          import io, os, sys, unittest
          sys.path.insert(0, os.getcwd())
          output = io.StringIO()
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(stream=output, verbosity=2).run(suite)
          print(output.getvalue())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Test results\n\n```text\n' + output.getvalue() + '\n```\n')
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Test Chrome interface
        run: python tests/browser_smoke.py
      - run: pyinstaller --noconfirm --onefile --windowed --add-data "static;static" --name SoGiaHan browser_app.py
      - name: Scan executable with Microsoft Defender
        shell: pwsh
        run: ./scripts/scan_windows.ps1
      - name: Test packaged EXE
        run: python tests/exe_smoke.py
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoGiaHan-security-report
          path: security-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: SoGiaHan-Windows
          path: |
            dist/SoGiaHan.exe
            dist/SoGiaHan.exe.sha256
            security-report/defender-report.json

name: Build Windows App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --onefile --windowed --name SoGiaHan desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: SoGiaHan-Windows
          path: dist/SoGiaHan.exe
